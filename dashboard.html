<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Dashboard</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dashboard {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
        }
        .headline {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0066cc;
            text-align: center;
            margin-bottom: 20px;
        }
        .dashboard h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .reading {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }
        .suggestions {
            margin-top: 20px;
        }
        .suggestions li {
            margin-bottom: 8px;
        }
        .btn-danger {
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="headline">☁️ Cloud Computing Project Development</div>
        <h2>💓 Health Dashboard</h2>
        <p class="reading"><strong>Heart Rate:</strong> {{ heart_rate }} bpm</p>
        <p class="reading"><strong>SpO₂:</strong> {{ spo2 }} %</p>

        <div class="suggestions">
            <h4>✨ Suggestions for Better Heart Health:</h4>
            <ul>
                {% for s in suggestions %}
                    <li>{{ s }}</li>
                {% endfor %}
            </ul>
        </div>

        <div class="text-center mt-4">
            <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
        </div>
    </div>
</body>
</html>
